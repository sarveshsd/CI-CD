name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - workflow
      - better-software

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the project code
      - name: Checkout code
        uses: actions/checkout@v2

      # 2. Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "17"

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # 4. Run tests
      - name: Run tests
        run: npm test
        working-directory: tests

      # 5. Build Docker Image
      - name: Build Docker Image
        run: |
          docker build -t myapp:latest .
        working-directory: .

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the project code
      - name: Checkout code
        uses: actions/checkout@v2

      # 2. Install Minikube and kubectl
      - name: Install Minikube and kubectl
        run: |
          curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
          sudo install minikube-linux-amd64 /usr/local/bin/minikube
          sudo apt-get update && sudo apt-get install -y conntrack kubectl

      # 3. Start Minikube
      - name: Start Minikube
        run: |
          minikube start --driver=none
          minikube status

      # 4. Use Minikube Docker
      - name: Use Minikube Docker
        run: |
          eval $(minikube docker-env)
          docker build -t myapp:latest .
        working-directory: .

      # 5. Apply Kubernetes manifests
      - name: Deploy to Minikube
        run: |
          kubectl apply -f kubernetes/deployment.yaml
          kubectl apply -f kubernetes/service.yaml
        working-directory: .

      # 6. Check Deployment Status
      - name: Check Deployment Status
        run: |
          kubectl rollout status deployment/myapp-deployment
        working-directory: .

      # 7. Notify Slack on deployment success
      - name: Notify Slack on deployment success
        if: success()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        with:
          args: 'Deployment to Minikube was successful!'

      # 8. Notify Slack on deployment failure
      - name: Notify Slack on deployment failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        with:
          args: 'Deployment to Minikube failed!'

